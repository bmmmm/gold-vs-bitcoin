name: ShellCheck

on:
  push:
    branches: [main]
    paths: ['scripts/**']
  pull_request:
    branches: [main]
    paths: ['scripts/**']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
